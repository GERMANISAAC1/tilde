<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Acentúa con Ñiki</title>
<script>try{var __t=localStorage.getItem('acentua-theme');if(__t==='dark'||__t==='light')document.documentElement.setAttribute('data-theme',__t);}catch(e){}</script>
<style>
/* Acentúa con Ñiki · sistema de diseño SaaS · sin internet, sin librerías
   Concepto: barra lateral + panel de control; un color de marca (índigo), acentos por módulo, Ñiki como guía. */
:root{
  --bg:#f6f7fb;--surface:#ffffff;--surface2:#f0f2f8;--ink:#0f1222;--muted:#586079;--line:#e3e6ef;--line2:#cdd3e4;
  --brand:#4f46e5;--brand-t:#4338ca;--brand-soft:#eceeff;
  --c-inicio:#4f46e5;--c-intro:#0f766e;--c-clasif:#6d28d9;--c-reglas:#c2410c;--c-dipt:#be185d;--c-diac:#1d4ed8;--c-ejer:#15803d;--c-juegos:#dc2626;--c-exam:#a16207;--c-prog:#0e7490;
  --good:#15803d;--goodbg:#e7f7ee;--bad:#c62828;--badbg:#fdecec;--warnbg:#fff4d6;--warnline:#e0a100;
  --tonic:#db2777;--tonic-t:#be185d;
  --sh1:0 1px 2px rgba(15,18,34,.05),0 1px 3px rgba(15,18,34,.06);
  --sh2:0 6px 16px rgba(15,18,34,.09),0 2px 4px rgba(15,18,34,.05);
  --r:16px;--r2:12px;
  --f:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a0c16;--surface:#131728;--surface2:#1b2036;--ink:#eceffb;--muted:#a0a9c6;--line:#252b45;--line2:#38405f;
    --brand-t:#a5b4fc;--brand-soft:#22265a;
    --good:#4ade80;--goodbg:#12301f;--bad:#fca5a5;--badbg:#3a1b20;--warnbg:#3b3110;--warnline:#c79a10;--tonic-t:#f9a8d4;
    --sh1:0 1px 2px rgba(0,0,0,.4);--sh2:0 8px 20px rgba(0,0,0,.45);color-scheme:dark}
}
:root[data-theme="dark"]{
  --bg:#0a0c16;--surface:#131728;--surface2:#1b2036;--ink:#eceffb;--muted:#a0a9c6;--line:#252b45;--line2:#38405f;
  --brand-t:#a5b4fc;--brand-soft:#22265a;
  --good:#4ade80;--goodbg:#12301f;--bad:#fca5a5;--badbg:#3a1b20;--warnbg:#3b3110;--warnline:#c79a10;--tonic-t:#f9a8d4;
  --sh1:0 1px 2px rgba(0,0,0,.4);--sh2:0 8px 20px rgba(0,0,0,.45);color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background-color:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(900px 320px at 50% -120px,var(--brand-soft),transparent)}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.02em;text-wrap:balance}
p{margin:0 0 10px}
ul{margin:6px 0 10px;padding-left:1.2em}li{margin:3px 0}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
main:focus,main:focus-visible{outline:none}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;z-index:99;background:var(--surface);color:var(--ink);padding:8px 12px;border-radius:8px;box-shadow:var(--sh2)}
.muted{color:var(--muted)}
.tn{color:var(--tonic-t);font-weight:800}
.mark{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:1px 8px;font-weight:700;display:inline-block}

/* ---- barra superior ---- */
.top{position:sticky;top:0;z-index:30;height:56px;display:flex;align-items:center;gap:8px;padding:0 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;letter-spacing:-.02em;margin-right:auto;min-width:0}
.brand img{width:34px;height:34px;border-radius:10px;object-fit:cover;object-position:center 25%;background:#dccfbc;flex:none}
.brand span{white-space:nowrap}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;font-size:18px}
.icon-btn:hover{background:var(--surface2)}
#menuBtn{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:.88rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.top .lvl{display:none}

/* ---- estructura ---- */
.shell{display:block}
.nav{display:none;position:fixed;top:56px;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:25;background:var(--surface);padding:10px 16px 24px;overflow:auto}
.nav.open{display:block}
.nav .grp{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:16px 10px 6px}
.nav .grp:first-child{margin-top:4px}
.nav a{position:relative;display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 10px;border-radius:10px;text-decoration:none;font-weight:600;font-size:.95rem;margin-bottom:2px}
.nav a .ni{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:16px;flex:none;background:color-mix(in srgb,var(--mc) 14%,var(--surface))}
.nav a:hover{background:var(--surface2)}
.nav a[aria-current=page]{background:var(--brand-soft);font-weight:800}
.nav a[aria-current=page]::before{content:"";position:absolute;left:-16px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--mc)}
.nav .nk{margin-left:auto;font-size:.75rem;color:var(--good);font-weight:800}
.nav .guide{margin-top:16px;display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface2);font-size:.88rem;font-weight:600}
main{padding:20px 16px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.page{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:16px;animation:in .3s ease}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:6px max(6px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-right,0px))}
.tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border:0;background:none;border-radius:12px;text-decoration:none;font-size:.7rem;font-weight:700;color:var(--muted)}
.tabbar .ti{font-size:20px;line-height:1}
.tabbar [aria-current=page],.tabbar [aria-expanded=true]{color:var(--brand-t);background:var(--brand-soft)}
@media (min-width:960px){
  .shell{display:grid;grid-template-columns:272px 1fr;max-width:1360px;margin:0 auto}
  .nav{display:block;position:sticky;top:56px;inset:auto;height:calc(100vh - 56px);align-self:start;background:transparent;border-right:1px solid var(--line);padding:12px 16px 24px}
  .nav a[aria-current=page]::before{left:-16px}
  .tabbar{display:none}
  main{padding:28px 32px 64px}
  .top .lvl{display:inline-flex}
}

/* ---- cabecera de módulo ---- */
.mhead{display:flex;flex-direction:column;gap:8px;padding:2px 0 4px}
.mhead .eyebrow{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:color-mix(in srgb,var(--mc) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--mc) 30%,var(--line));padding:4px 12px;border-radius:999px}
.mhead .eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mc)}
.mhead h1{font-size:clamp(1.65rem,5vw,2.3rem);font-weight:800}
.mhead p{margin:0;color:var(--muted)}

/* ---- tarjetas ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh1)}
.card h2{font-size:1.15rem;margin-bottom:8px;font-weight:800}
.card h3{font-size:1rem;margin-bottom:6px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.tip,.warn{border-radius:12px;padding:12px 14px;font-size:.95rem;font-weight:500}
.tip{background:var(--warnbg);border:1px solid var(--warnline)}
.warn{background:var(--badbg);border:1px solid var(--bad)}
.tip b,.warn b{font-weight:800}

/* ---- Ñiki ---- */
.coach{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh1)}
.niki{position:relative;width:64px;aspect-ratio:1/1.1;flex:none;border-radius:16px;background:#dccfbc;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.niki .pose{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%;border-radius:16px}
.niki[data-pose=sleep] .pose{object-fit:contain;object-position:center}
.niki .face{position:absolute;right:-6px;bottom:-6px;width:28px;height:28px;border-radius:50%;object-fit:cover;object-position:center 30%;border:2px solid var(--surface);background:#dccfbc}
.niki.sm{width:48px;border-radius:13px}.niki.sm .pose{border-radius:13px}.niki.sm .face{width:22px;height:22px}
.niki.lg{width:132px;border-radius:24px;animation:float 4s ease-in-out infinite}.niki.lg .pose{border-radius:24px}.niki.lg .face{width:52px;height:52px;border-width:3px;right:-10px;bottom:-10px}
.niki.jump{animation:jump .6s}
.bubble{flex:1;min-width:0;font-weight:500;font-size:.98rem}

/* ---- botones ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 18px;border:0;border-radius:12px;background:var(--mc,var(--brand));color:#fff;font-weight:700;font-size:.95rem;text-decoration:none;
  box-shadow:0 1px 2px rgba(15,18,34,.2),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .12s,filter .12s,box-shadow .12s}
.btn:hover{filter:brightness(1.08);box-shadow:0 4px 12px rgba(15,18,34,.2),inset 0 1px 0 rgba(255,255,255,.18)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line2);box-shadow:var(--sh1)}
.btn.ghost:hover{background:var(--surface2);filter:none}
.btn.sm{min-height:38px;padding:6px 14px;font-size:.9rem;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:default;filter:none;transform:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ---- pestañas segmentadas ---- */
.tabs{display:flex;gap:2px;padding:4px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;overflow-x:auto;max-width:100%;scrollbar-width:none;align-self:flex-start}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;border-radius:10px;min-height:40px;padding:6px 14px;font-weight:700;font-size:.92rem;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:var(--sh1)}

/* ---- tarjetas de módulo ---- */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:6px 2px 0}
.sec-h h2{font-size:1rem;font-weight:800;margin:0}
.sec-h span{color:var(--muted);font-size:.85rem}
.mc{position:relative;display:flex;align-items:center;gap:14px;text-align:left;text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;box-shadow:var(--sh1);transition:transform .15s,box-shadow .15s,border-color .15s;min-width:0}
.mc:hover{transform:translateY(-2px);box-shadow:var(--sh2);border-color:color-mix(in srgb,var(--mc) 50%,var(--line))}
.mc .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:none;background:color-mix(in srgb,var(--mc) 14%,var(--surface))}
.mc .tx{display:flex;flex-direction:column;gap:1px;min-width:0}
.mc b{font-size:.98rem;line-height:1.25}
.mc .d{color:var(--muted);font-size:.86rem;line-height:1.35}
.mc .done{font-size:.78rem;font-weight:800;color:var(--good)}
.mc::after{content:"›";margin-left:auto;font-size:1.4rem;color:var(--line2);flex:none}
.stag>*{animation:in .4s ease both}
.stag>*:nth-child(2){animation-delay:.04s}.stag>*:nth-child(3){animation-delay:.08s}.stag>*:nth-child(4){animation-delay:.12s}.stag>*:nth-child(5){animation-delay:.16s}.stag>*:nth-child(6){animation-delay:.2s}

/* ---- panel (dashboard) ---- */
.hero{display:flex;flex-wrap:wrap;align-items:center;gap:20px;padding:24px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(135deg,var(--brand-soft),var(--surface) 70%);box-shadow:var(--sh1)}
.hero .tx{flex:1;min-width:240px;display:flex;flex-direction:column;gap:8px}
.hero h1{font-size:clamp(1.6rem,5vw,2.2rem);font-weight:800}
.hero p{color:var(--muted);margin:0}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.kpi{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh1)}
.kpi .l{font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-size:1.65rem;font-weight:800;letter-spacing:-.03em;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.82rem;color:var(--muted)}
.ring{position:relative;flex:none;display:grid;place-items:center}
.ring svg circle.rfg{transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ring .rv{position:absolute;font-size:.8rem;font-weight:800;font-variant-numeric:tabular-nums}
.two{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:760px){.two{grid-template-columns:1fr 1fr}}
.cols{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;margin-top:8px}
.col{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.col .cv{font-size:.74rem;font-weight:800;color:var(--muted);min-height:1em;font-variant-numeric:tabular-nums}
.col .cb{width:100%;height:120px;display:flex;align-items:flex-end;background:repeating-linear-gradient(0deg,var(--line) 0 1px,transparent 1px 40px);border-radius:8px}
.col .cb i{display:block;width:100%;min-height:4px;border-radius:8px 8px 3px 3px;background:var(--line2);transition:height .8s cubic-bezier(.2,.8,.2,1)}
.col.now .cb i{background:linear-gradient(180deg,var(--brand),color-mix(in srgb,var(--brand) 60%,#fff))}
.col .cb i.has{background:color-mix(in srgb,var(--brand) 55%,var(--line2))}
.col.now .cb i.has{background:linear-gradient(180deg,var(--brand),color-mix(in srgb,var(--brand) 60%,#fff))}
.col .cl{font-size:.76rem;font-weight:700;color:var(--muted);text-transform:capitalize}
.col.now .cl{color:var(--brand-t)}
.empty{border:1px dashed var(--line2);border-radius:12px;padding:16px;color:var(--muted);text-align:center;font-size:.92rem}
.spark{width:100%;height:auto;display:block;overflow:visible}
.spark text{fill:var(--muted);font-size:10px;font-weight:700}

/* ---- sílabas y palabras ---- */
.syls{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.syl{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:4px 12px;border-radius:12px;border:1px solid var(--line2);background:var(--surface2);font-weight:800;font-size:1.3rem;color:var(--ink)}
.syl.t{background:var(--tonic);border-color:var(--tonic);color:#fff;transform:scale(1.08);box-shadow:0 4px 12px color-mix(in srgb,var(--tonic) 40%,transparent)}
.syl.dp{background:var(--warnbg);border-color:var(--warnline);color:var(--ink)}
.sep{color:var(--muted);font-weight:800}
.big{font-size:1.6rem;font-weight:800;letter-spacing:-.01em}
.bounce .syl{animation:hop .6s ease both}.bounce .syl.t{animation:hopbig .7s ease both}
.wcard{display:flex;flex-direction:column;gap:8px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--sh1)}
.wcard .em{font-size:30px;line-height:1}
.pos{display:flex;gap:6px;flex-wrap:wrap;font-size:.72rem;font-weight:700;color:var(--muted)}
.pos span{min-width:44px;text-align:center}
.tbl{width:100%;border-collapse:collapse;font-size:.94rem}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}
.tbl th{background:var(--surface2);font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.scroll{overflow-x:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.wchip{border:1px solid var(--line2);background:var(--surface);border-radius:999px;min-height:38px;padding:4px 14px;font-weight:700;font-size:.92rem}
.wchip:hover{background:var(--surface2)}
.wchip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
select,input[type=text]{min-height:44px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);padding:6px 12px;max-width:100%}
select:focus,input[type=text]:focus{outline:2px solid var(--brand);outline-offset:1px}
.flip{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px;text-align:left;box-shadow:var(--sh1)}
button.flip:hover{box-shadow:var(--sh2);border-color:color-mix(in srgb,var(--mc) 45%,var(--line))}
.flip .pair{font-size:1.5rem;font-weight:800}
.flip .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.flip .two>div{background:var(--surface2);border-radius:10px;padding:10px;font-size:.92rem}
.flip .two b.w{display:block;font-size:1.25rem;font-weight:800}
.flip .tilde b.w{color:var(--tonic-t)}
@media (max-width:420px){.flip .two{grid-template-columns:1fr}}

/* ---- preguntas ---- */
.qhead{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;font-weight:700;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--surface2);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--mc,var(--brand)),color-mix(in srgb,var(--mc,var(--brand)) 65%,#fff));border-radius:999px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.q .prompt{font-size:1.15rem;font-weight:700;margin:0 0 14px;line-height:1.4}
.opts{display:grid;gap:10px;grid-template-columns:1fr;margin-top:14px}
@media (min-width:600px){.opts{grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}}
.opt{display:flex;align-items:center;gap:12px;border:1px solid var(--line2);background:var(--surface);border-radius:12px;min-height:56px;padding:10px 14px;font-weight:700;font-size:1.05rem;text-align:left;box-shadow:var(--sh1);transition:transform .12s,border-color .12s,background .12s}
.opt::before{content:attr(data-k);flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);font-size:.8rem;font-weight:800;color:var(--muted)}
.opt:not([data-k])::before{display:none}
.opt:hover:not([disabled]){border-color:var(--brand);transform:translateY(-1px)}
.opt.big::before{display:none}
.opt.big{justify-content:center;text-align:center;font-size:1.4rem;min-height:64px}
.opt.ok{background:var(--goodbg);border-color:var(--good);color:var(--good)}
.opt.ok::before{background:var(--good);color:#fff;border-color:var(--good)}
.opt.no{background:var(--badbg);border-color:var(--bad);color:var(--bad);animation:shake .35s}
.opt.off{opacity:.45}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px;font-weight:500;animation:in .25s ease}
.fb.good{background:var(--goodbg);border:1px solid var(--good)}
.fb.bad{background:var(--badbg);border:1px solid var(--bad)}
.score-big{font-size:3.4rem;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--mc);font-variant-numeric:tabular-nums}

/* ---- ruleta y carrera ---- */
.wheelbox{position:relative;width:min(320px,82vw);margin:6px auto}
.wheel{position:relative;width:100%;aspect-ratio:1;border-radius:50%;border:6px solid var(--surface);box-shadow:0 0 0 1px var(--line2),0 14px 30px rgba(15,18,34,.25);transition:transform 4s cubic-bezier(.12,.7,.12,1)}
.wheel .lb{position:absolute;left:50%;top:50%;width:0;height:0}
.wheel .lb span{position:absolute;left:-44px;top:-124px;width:88px;text-align:center;font-weight:800;font-size:.8rem;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);line-height:1.1}
.ptr{position:absolute;left:50%;top:-10px;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:28px solid var(--ink);z-index:2;filter:drop-shadow(0 2px 0 var(--surface))}
.hub{position:absolute;left:50%;top:50%;width:60px;height:60px;border-radius:50%;transform:translate(-50%,-50%);background:var(--surface);border:1px solid var(--line2);box-shadow:var(--sh2);display:grid;place-items:center;font-size:24px;z-index:1}
.lane{position:relative;height:60px;border-radius:30px;background:var(--surface2);border:1px solid var(--line);margin:6px 0}
.lane .fin{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:24px}
.lane .rn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;transition:left .5s;background:var(--surface);border:2px solid var(--mc);box-shadow:var(--sh1)}
.lane .rn img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:center 28%}

/* ---- progreso ---- */
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--sh1)}
.stat b{display:block;font-size:1.6rem;line-height:1.15;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-weight:600;font-size:.85rem}
.bds{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,140px),1fr))}
.bd{border:1px solid var(--line);border-radius:14px;padding:14px 12px;text-align:center;background:var(--surface);box-shadow:var(--sh1)}
.bd .e{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 6px;border-radius:50%;font-size:26px;background:var(--warnbg);border:1px solid var(--warnline)}
.bd.off{opacity:.55}.bd.off .e{filter:grayscale(1);background:var(--surface2);border-color:var(--line2)}
.bd b{display:block;font-size:.92rem}.bd small{color:var(--muted);font-size:.78rem;line-height:1.3;display:block}
.catrow{display:grid;grid-template-columns:150px 1fr 48px;gap:12px;align-items:center;font-weight:600;font-size:.92rem}
.catrow .bar{height:10px}
.catrow>span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
@media (max-width:480px){.catrow{grid-template-columns:104px 1fr 42px;font-size:.84rem}}

/* ---- certificado ---- */
.cert{background:#fffdf5;color:#2b2358;border:8px double #a16207;border-radius:10px;padding:28px 22px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.cert h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.8rem,6vw,2.8rem);color:#a16207;letter-spacing:.5px}
.cert .nm{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.6rem,6vw,2.6rem);font-weight:700;border-bottom:2px solid #a16207;padding:0 24px;min-width:60%;word-break:break-word}
.cert .niki{animation:none}

/* ---- avisos ---- */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140px);opacity:0;visibility:hidden;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:700;font-size:.92rem;z-index:60;transition:transform .35s cubic-bezier(.2,.8,.2,1);max-width:92vw;text-align:center;box-shadow:var(--sh2)}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
@media (min-width:960px){.toast{bottom:28px}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti span{position:absolute;top:-30px;animation:fall 1.8s ease-in forwards}

@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes float{50%{transform:translateY(-5px)}}
@keyframes jump{30%{transform:translateY(-14px) scale(1.05)}60%{transform:none}80%{transform:translateY(-5px)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-8px)}100%{transform:translateY(0)}}
@keyframes hopbig{0%{transform:scale(1)}40%{transform:translateY(-20px) scale(1.3)}100%{transform:scale(1.08)}}
@keyframes fall{to{transform:translateY(105vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

/* ---- impresión: solo el certificado ---- */
@page{size:landscape;margin:10mm}
@media print{
  body{background:#fff}
  body *{visibility:hidden}
  #certArea,#certArea *{visibility:visible}
  #certArea{position:absolute;left:0;top:0;width:100%}
}
</style>

function vowelIdx(syl){
  var p=strip(syl.toLowerCase()),v=[],i,k;
  for(i=0;i<p.length;i++)if('aeiou'.indexOf(p[i])>-1)v.push(i);

  for(k=0;k<v.length;k++)if(/[áéíóú]/.test(syl[v[k]]))return v[k];
  for(k=0;k<v.length;k++)if('aeo'.indexOf(p[v[k]])>-1)return v[k];
  return v[v.length-1];
}

  var r;
  if(w.type==='aguda')r=w.tilde?'Termina en n, s o vocal, por eso lleva tilde.':'No termina en n, s ni vocal, por eso no lleva tilde.';
  else if(w.type==='grave')r=w.tilde?'No termina en n, s ni vocal, por eso lleva tilde.':'Termina en n, s o vocal, por eso no lleva tilde.';
  else r='Las '+(w.type==='esdrujula'?'esdrújulas':'sobresdrújulas')+' siempre llevan tilde.';
  return '<b>'+esc(w.w)+'</b> ('+parts+') es '+tn+'. '+r;
}
function okWords(){return WORDS.filter(function(w){return AMBIG.indexOf(w.w)<0;});}

/* ============ GENERADORES DE PREGUNTAS ============ */
function mk(cat,prompt,show,good,bad,whyTxt,lay){
  var o=shuffle([good].concat(bad));
  return {cat:cat,prompt:prompt,show:show||'',opts:o,ans:o.indexOf(good),why:whyTxt,lay:lay};
}
function qTonic(w){
  w=w||rnd(WORDS);
  return {cat:'tonica',prompt:'Toca la <span class="tn">sílaba tónica</span> (la que suena más fuerte) de <span class="big">'+esc(w.w)+'</span>',show:'',opts:w.s.slice(),ans:w.t,why:why(w),lay:'syl'};
}
function qClasif(w){
  w=w||rnd(WORDS);
  return {cat:'clasif',prompt:'La sílaba tónica de esta palabra está resaltada. ¿Cómo se clasifica según su acento?',show:sylsHTML(w.s,w.t),opts:TYPES.map(function(t){return TNAME[t];}),ans:TYPES.indexOf(w.type),why:why(w)};
}
function qTilde(w){
  w=w||rnd(okWords());
  var p=strip(w.w),ti=tonicPos(w),set=[w.w],vs=[],i;
  function add(x){if(set.indexOf(x)<0)set.push(x);}
  for(i=0;i<p.length;i++)if('aeiou'.indexOf(p[i])>-1&&i!==ti)vs.push(i);
  add(w.tilde?p:accentAt(p,ti));
  shuffle(vs).forEach(function(k){if(set.length<3)add(accentAt(p,k));});
  return mk('tilde','Observa las sílabas (la tónica está resaltada). ¿Cómo se escribe correctamente la palabra?',sylsHTML(w.s.map(strip),w.t),w.w,set.slice(1),why(w));
}
function qComplete(w){
  w=w||rnd(okWords().filter(function(x){return x.tilde;}));
  var ix=w.w.search(/[áéíóú]/),c=w.w[ix],blank=esc(w.w.slice(0,ix))+'<span class="mark">_</span>'+esc(w.w.slice(ix+1));
  var other=rnd('áéíóú'.split('').filter(function(x){return x!==c;}));
  return mk('completar','Completa la palabra con la letra correcta. Pista: es una palabra <b>'+TLOW[w.type]+'</b>.','<p class="big" style="letter-spacing:3px">'+blank+'</p>',c,[strip(c),other],why(w));
}
function qWrong(){
  var ws=pickN(WORDS,4),a=rnd(okWords()),k;
  ws=ws.filter(function(x){return x.w!==a.w;}).slice(0,3);ws.push(a);ws=shuffle(ws);
  var p=strip(a.w),bad;
  if(a.tilde&&Math.random()<.5){bad=p;}
  else{
    var ti=tonicPos(a),vs=[];
    for(k=0;k<p.length;k++)if('aeiou'.indexOf(p[k])>-1&&(a.tilde?k!==ti:true))vs.push(k);
    bad=a.tilde?(vs.length?accentAt(p,rnd(vs)):p):accentAt(p,ti);
    if(bad===a.w)bad=a.tilde?p:accentAt(p,rnd(vs));
  }
  var opts=ws.map(function(x){return x.w===a.w?bad:x.w;});
  return {cat:'errores',prompt:'Una de estas palabras está mal escrita (tiene un error de tilde). ¿Cuál es?',show:'',opts:opts,ans:ws.indexOf(a),why:'La forma correcta es <b>'+esc(a.w)+'</b>. '+why(a)};
}
function qSent(it){
  it=it||rnd(SENT);
  return mk('oraciones','Una de estas oraciones tiene errores de acentuación. ¿Cuál está escrita correctamente?','',it.ok,it.bad,esc(it.why)+' Correcta: «'+esc(it.ok)+'»','sent');
}
function qDiac(it){
  it=it||rnd(DQ);
  return {cat:'diacritica',prompt:'Elige la palabra que completa la oración:',show:'<p class="big">'+esc(it.s).replace('___','<span class="mark">___</span>')+'</p>',opts:it.o.slice(),ans:it.a,why:esc(it.why)+' «'+esc(it.s.replace('___',it.o[it.a]))+'»'};
}
function qDip(d){
  d=d||rnd(DIP);
  return {cat:'diptongo',prompt:'¿Esta palabra tiene diptongo o hiato?',show:'<p class="big">'+esc(d.w)+'</p>',opts:['Diptongo','Hiato'],ans:d.k==='dip'?0:1,why:'<b>'+esc(d.w)+'</b> se separa así: '+d.s.map(esc).join('-')+'. '+esc(d.n)+'. Es un '+(d.k==='dip'?'diptongo':'hiato')+'.'};
}
function qRule(r){
  r=r||rnd(RQ);
  return mk('reglas',esc(r.q),'',r.o[r.a],r.o.filter(function(_,i){return i!==r.a;}),esc(r.why));
}
function qMixed(){
  var bag=[qTonic,qTonic,qClasif,qClasif,qTilde,qTilde,qComplete,qWrong,qSent,qDiac,qDiac,qDip,qRule];
  return rnd(bag)();
}
function mixedSet(n){
  var out=[],seen={},guard=0;
  while(out.length<n&&guard++<400){var q=qMixed(),k=q.prompt+q.show+q.opts.join('|');if(!seen[k]){seen[k]=1;out.push(q);}}
  return out;
}

/* ============ PREGUNTA INTERACTIVA ============ */
function askQuestion(host,q,onAnswer){
  host.innerHTML='<div class="card q"><div class="prompt">'+q.prompt+'</div>'+(q.show||'')+'<div class="opts" role="group" aria-label="Respuestas">'+
    q.opts.map(function(o,i){return '<button type="button" class="opt'+(q.lay==='syl'?' big':'')+'" data-i="'+i+'" data-k="'+'ABCDEFGH'.charAt(i)+'"'+(q.lay==='sent'?' style="font-size:1rem;text-align:left"':'')+'>'+esc(o)+'</button>';}).join('')+
    '</div><div class="fbh" aria-live="polite"></div></div>';
  var btns=$$('.opt',host),fbh=$('.fbh',host),locked=false;
  function answer(i){
    if(locked)return;locked=true;
    var ok=(i===q.ans);
    btns.forEach(function(b,k){b.disabled=true;if(k===q.ans)b.classList.add('ok');else if(k===i)b.classList.add('no');else b.classList.add('off');});
    fbh.innerHTML='<div class="fb '+(ok?'good':'bad')+'"><b>'+(ok?'¡Correcto! ':'Casi. ')+'</b>'+q.why+'</div>';
    if(ok)sOk();else sNo();
    if(onAnswer)onAnswer(ok,i);
  }
  btns.forEach(function(b){b.addEventListener('click',function(){answer(+b.getAttribute('data-i'));});});
  function key(e){
    if(locked||!document.body.contains(host)){document.removeEventListener('keydown',key);return;}
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    var t=e.target&&e.target.tagName;if(t==='INPUT'||t==='SELECT'||t==='TEXTAREA')return;
    var i=e.key.length===1?'abcdefgh'.indexOf(e.key.toLowerCase()):-1;
    if(i<0||i>=btns.length||btns[i].disabled)return;
    e.preventDefault();document.removeEventListener('keydown',key);answer(i);
  }
  document.addEventListener('keydown',key);
  return {
    fb:function(){return fbh;},
    lock:function(){locked=true;btns.forEach(function(b){b.disabled=true;});},
    fifty:function(){var w=btns.filter(function(_,k){return k!==q.ans;});shuffle(w).slice(0,Math.max(0,w.length-1)).forEach(function(b){b.disabled=true;b.classList.add('off');});}
  };
}
function miniPractice(host,makers,n){
  var qs=[],i=0,good=0;
  for(var k=0;k<n;k++)qs.push(makers[k%makers.length]());
  host.innerHTML='<div class="card"><h2>✅ Comprueba lo que aprendiste</h2><p class="muted mpn"></p><div class="mpq"></div></div>';
  function show(){
    var box=$('.mpq',host);
    if(i>=qs.length){
      box.innerHTML='<div class="tip">'+(good===qs.length?'¡Perfecto! Acertaste todas.':'Acertaste '+good+' de '+qs.length+'. Repasa la explicación y vuelve a intentarlo.')+'</div><p></p><button type="button" class="btn sm mpr">🔁 Practicar otra vez</button>';
      $('.mpn',host).textContent='';
      $('.mpr',host).onclick=function(){miniPractice(host,makers,n);};
      if(good===qs.length){sWin();confetti();}
      return;
    }
    $('.mpn',host).textContent='Pregunta '+(i+1)+' de '+qs.length;
    var q=qs[i];
    var h=askQuestion(box,q,function(ok){
      record(q.cat,ok);if(ok)good++;
      var b=document.createElement('button');b.type='button';b.className='btn sm';b.style.marginTop='12px';
      b.textContent=i+1<qs.length?'Siguiente →':'Ver resultado';b.onclick=function(){i++;show();};
      h.fb().appendChild(b);
    });
  }
  show();
}

function runQuiz(host,cfg){
  var mc=cfg.mc||'var(--c-ejer)',N=cfg.n||10;
  var st={i:0,ok:0,pts:0,st:0,log:[],left:cfg.timer||0,me:0,rv:0,fifty:1,skip:1,over:false,ans:0};
  var tmr=null,rvt=null,cur=null,h=null,fixed=cfg.fixed||null,timeout=null;
  function stop(){clearInterval(tmr);clearInterval(rvt);clearTimeout(timeout);}
  onLeave(stop);
  function intro(){

    $('#goBtn',host).onclick=function(){if(cfg.onStart&&cfg.onStart()===false)return;start();};
    if(cfg.back)$('#backBtn',host).onclick=function(){stop();cfg.back();};
  }
  function frame(){
    host.innerHTML='<div class="page" style="--mc:'+mc+'">'+head(cfg.eyebrow||'Actividad',cfg.title)+
      '<div class="qhead"><span id="qn"></span><span id="qs"></span></div>'+
      (cfg.timer?'<div class="bar timer" aria-label="Tiempo restante"><i id="tb" style="width:100%"></i></div>':'<div class="bar"><i id="pb" style="width:0"></i></div>')+
      (cfg.race?'<div class="lane" aria-label="Pista"><span class="fin">🏁</span><div class="trk" style="position:absolute;left:4px;right:62px;top:0;bottom:0"><div class="rn" id="rvr" style="left:0;top:25%;border-color:#e0453f;width:44px;height:44px;font-size:24px;z-index:1">✏️</div><div class="rn" id="mer" style="left:0;top:58%"></div></div></div><p class="muted" style="margin:0">✏️ Tilde Traviesa avanza cada 7 segundos y cuando fallas. ¡Llega primero a la meta!</p>':'')+
      coach('','stand','curio','qc')+'<div id="qa"></div><div class="row" id="ctl"></div></div>';
    if(cfg.race){var m=$('#mer',host);m.innerHTML='<img src="'+NIKI.f.joy+'" alt="Ñiki">';}
  }
  function pos(){
    if(!cfg.race)return;
    var m=$('#mer',host),r=$('#rvr',host);
    if(m)m.style.left=Math.min(100,st.me/cfg.race*100)+'%';
    if(r)r.style.left=Math.min(100,st.rv/cfg.race*100)+'%';
  }
  function hud(){
    var n=$('#qn',host),s=$('#qs',host),pb=$('#pb',host);
    if(!n)return;
    if(cfg.timer)n.textContent='⏱️ '+st.left+' s · Aciertos: '+st.ok;
    else if(cfg.race)n.textContent='Tú: '+st.me+' / '+cfg.race+' · Rival: '+st.rv+' / '+cfg.race;
    else n.textContent='Pregunta '+Math.min(st.i+1,N)+' de '+N;
    s.textContent='⭐ '+st.pts+(st.st>=3?' · 🔥 racha '+st.st:'');
    if(pb)pb.style.width=(st.i/N*100)+'%';
  }
  function start(){
    frame();
    if(!fixed&&!cfg.timer&&!cfg.race){fixed=[];for(var i=0;i<N;i++)fixed.push(cfg.gen(i));}
    if(cfg.timer){tmr=setInterval(function(){st.left--;var tb=$('#tb',host);if(tb)tb.style.width=Math.max(0,st.left/cfg.timer*100)+'%';hud();if(st.left<=0){st.over=true;finish();}},1000);}
    if(cfg.race){rvt=setInterval(function(){rivalMove();},7000);}
    next();
  }
  function rivalMove(){st.rv++;pos();hud();if(st.rv>=cfg.race&&!st.over){st.over=true;finish();}}
  function next(){
    if(st.over)return;
    if(cfg.race||cfg.timer)cur=cfg.gen(st.i);
    else{if(st.i>=N){finish();return;}cur=fixed[st.i];}
    hud();
    var tips=['stand','think'];
    react('qc','think','curio','Lee con atención y elige tu respuesta.');
    h=askQuestion($('#qa',host),cur,onAns);
    var ctl=$('#ctl',host);ctl.innerHTML='';
    if(cfg.lifelines){
      ctl.innerHTML='<button type="button" class="btn ghost sm" id="f50">✂️ 50:50 ('+st.fifty+')</button><button type="button" class="btn ghost sm" id="skp">⏭️ Saltar ('+st.skip+')</button>';
      $('#f50',host).onclick=function(){if(st.fifty<1||!h)return;st.fifty--;h.fifty();this.disabled=true;this.textContent='✂️ 50:50 (0)';};
      $('#skp',host).onclick=function(){if(st.skip<1)return;st.skip--;if(fixed)fixed[st.i]=cfg.gen(st.i);next();};
    }
  }
  function onAns(ok,idx){
    var pts=0;
    if(ok){st.ok++;st.st++;pts=cfg.pts||10;if(cfg.bonus&&st.st>=3)pts+=5;st.pts+=pts;if(cfg.race){st.me++;pos();}}
    else{st.st=0;if(cfg.race){st.rv++;pos();}}
    st.ans++;
    record(cur.cat,ok,pts);
    st.log.push({q:cur,idx:idx,ok:ok});
    react('qc',ok?'jump':'think',ok?'joy':'confusion',ok?rnd(['¡Muy bien!','¡Excelente!','¡Eso es!','¡Qué bien acentúas!']):rnd(['Casi. Lee la explicación y sigue.','No pasa nada, así se aprende.','¡Ánimo! La próxima sale.']));
    hud();
    if(cfg.race&&(st.me>=cfg.race||st.rv>=cfg.race)){st.over=true;timeout=setTimeout(finish,900);return;}
    if(cfg.auto){timeout=setTimeout(function(){st.i++;next();},ok?cfg.auto:cfg.auto*2);h.lock();return;}
    var b=document.createElement('button');b.type='button';b.className='btn';b.style.marginTop='12px';
    var last=!cfg.race&&!cfg.timer&&st.i+1>=N;
    b.textContent=last?'Ver resultados 🏁':'Siguiente →';
    b.onclick=function(){st.i++;next();};
    h.fb().appendChild(b);b.focus({preventScroll:true});
    var ctl=$('#ctl',host);ctl.innerHTML='';
  }
  function finish(){
    stop();
    S.played++;
    var n=st.ans,pct=n?Math.round(st.ok/n*100):0;
    var res={ok:st.ok,n:n,pct:pct,pts:st.pts,win:cfg.race?(st.me>=cfg.race&&st.rv<cfg.race):null,log:st.log,N:N};
    if(cfg.id&&cfg.bestOf){var val=cfg.bestOf(res);if(val>(S.best[cfg.id]||0))S.best[cfg.id]=val;}
    var bonus=0;
    if(cfg.race&&res.win){bonus=50;S.best.carreraWin=(S.best.carreraWin||0)+1;}
    if(cfg.end)bonus+=(cfg.end(res)||0);
    if(bonus)gain(bonus);
    save();updateChips();checkBadges();
    var wrong=st.log.filter(function(l){return !l.ok;});
    var msg=pct>=90?'¡Excelente trabajo!':pct>=70?'¡Muy bien!':pct>=50?'Bien, sigue practicando.':'Repasa los módulos y vuelve a intentarlo.';
    if(cfg.race)msg=res.win?'¡Ganaste la carrera! 🏆':'Tilde Traviesa llegó primero. ¡Revancha!';
    if(pct>=70||res.win){sWin();confetti();}
    host.innerHTML='<div class="page" style="--mc:'+mc+'">'+head(cfg.eyebrow||'Resultados',cfg.title)+
      '<div class="card" style="text-align:center"><div class="score-big">'+st.ok+' / '+n+'</div><p><b>'+pct+' % de aciertos</b> · +'+(st.pts+bonus)+' puntos'+(bonus?' (incluye bonus de '+bonus+')':'')+'</p><p>'+msg+'</p></div>'+
      coach(pct>=70?'¡Lo hiciste genial! Cada práctica te hace más fuerte.':'Cada error enseña algo. Revisa abajo qué pasó.',pct>=70?'jump':'think',pct>=70?'laugh':'curio','qc')+
      (cfg.endHTML?cfg.endHTML(res):'')+
      (wrong.length?'<div class="card"><h2>Respuestas por revisar ('+wrong.length+')</h2>'+wrong.map(function(l){return '<div class="fb bad" style="margin-bottom:10px"><div class="prompt" style="font-weight:800">'+l.q.prompt+'</div>'+(l.q.show||'')+'<p style="margin:8px 0 4px">Tu respuesta: <b>'+esc(l.q.opts[l.idx])+'</b> · Correcta: <b>'+esc(l.q.opts[l.q.ans])+'</b></p><p style="margin:0">'+l.q.why+'</p></div>';}).join('')+'</div>':'<div class="tip">¡No tuviste ningún error! 🎉</div>')+
      '<div class="row"><button type="button" class="btn" id="again">🔁 Jugar otra vez</button>'+(cfg.extraBtns?cfg.extraBtns(res):'')+(cfg.back?'<button type="button" class="btn ghost" id="backBtn">← Volver</button>':'')+'</div></div>';
    $('#again',host).onclick=function(){st={i:0,ok:0,pts:0,st:0,log:[],left:cfg.timer||0,me:0,rv:0,fifty:1,skip:1,over:false,ans:0};fixed=cfg.fixed||null;if(cfg.onStart&&cfg.onStart()===false)return;start();};
    if(cfg.back)$('#backBtn',host).onclick=function(){cfg.back();};
    if(cfg.afterEnd)cfg.afterEnd(host,res);
  }
  intro();
}

function page(c,inner){return '<div class="page" style="--mc:var('+c+')">'+inner+'</div>';}
function chipsOf(list){return '<div class="chips">'+list.map(function(w){return '<span class="mark">'+esc(w)+'</span>';}).join('')+'</div>';}
function wordCard(w,extra){
  return '<div class="wcard">'+(EMO[w.w]?'<span class="em" aria-hidden="true">'+EMO[w.w]+'</span>':'')+sylsHTML(w.s,w.t)+posLabels(w.s.length,w.t)+
    '<span class="muted" style="font-weight:700">'+(w.tilde?'✔ Lleva tilde: <b>'+esc(w.w)+'</b>':'✘ No lleva tilde: <b>'+esc(w.w)+'</b>')+'</span>'+(extra||'')+'</div>';
}
function byW(list){return list.map(function(x){return WORDS.filter(function(w){return w.w===x;})[0];});}

/* ---------- INICIO ---------- */

    '<div class="kpis">'+
      '<div class="kpi">'+ringSVG(lp,64,'var(--brand)')+'<div><div class="l">Nivel</div><div class="v">'+l.e+' '+l.n+'</div><div class="s">'+(nx?'faltan '+(nx.p-S.pts)+' pts para '+nx.n:'nivel máximo')+'</div></div></div>'+
      '<div class="kpi"><div><div class="l">Puntos</div><div class="v" data-count="'+S.pts+'">'+S.pts+'</div><div class="s">acumulados</div></div></div>'+

      '<div class="kpi">'+ringSVG(vp,64,'var(--c-clasif)')+'<div><div class="l">Insignias</div><div class="v">'+nb+' / '+BADGES.length+'</div><div class="s">'+vis+' de 5 módulos leídos</div></div></div>'+
    '</div>'+

    '<div class="sec-h"><h2>Aprende</h2><span>Módulos 1 a 5</span></div><div class="grid stag">'+MODS.slice(1,6).map(card).join('')+'</div>'+
    '<div class="sec-h"><h2>Practica y mide tu avance</h2><span>Módulos 6 a 9</span></div><div class="grid stag">'+MODS.slice(6).map(card).join('')+'</div>'+

/* ---------- 1. INTRODUCCIÓN ---------- */
VIEWS.intro=function(host){
  var demo=['casa','café','árbol','música','mariposa','cuéntamelo'].map(function(x){return WORDS.filter(function(w){return w.w===x;})[0];});
  var ex=byW(['café','árbol','música','mariposa','camión','lápiz']);
  host.innerHTML=page('--c-intro',
    head('Módulo 1','Introducción a la acentuación')+
    coach('Todas las palabras tienen una sílaba que suena más fuerte. ¡Aprender a encontrarla es el primer paso!','think','curio','ic')+
    '<div class="card"><h2>¿Qué es la acentuación?</h2><p>Acentuar es <b>resaltar una sílaba</b> al pronunciar una palabra. A veces esa fuerza de voz también se marca por escrito con una <b>tilde</b> (´).</p><p>Por ejemplo, no decimos «ca-FÉ» y «CA-fe» igual: la fuerza cambia el sonido, y en algunas palabras hasta cambia el significado: <b>papa</b> (alimento) y <b>papá</b> (padre).</p></div>'+
    '<div class="grid"><div class="card"><h2>🔊 Acento prosódico</h2><p>Es la <b>fuerza de voz</b> con que pronunciamos una sílaba.</p><ul><li>Lo tienen todas las palabras de dos o más sílabas.</li><li>Se pronuncia, <b>no se escribe</b>.</li></ul><p class="mark">ca<b class="tn">SA</b> · <b class="tn">ÁR</b>bol · ca<b class="tn">FÉ</b></p></div>'+
    '<div class="card"><h2>✏️ Acento ortográfico</h2><p>Es la <b>tilde</b> (´): la rayita que se escribe sobre una vocal.</p><ul><li>Solo la llevan algunas palabras, según las reglas.</li><li>Se escribe sobre la vocal de la sílaba tónica.</li></ul><p class="mark">casa (sin tilde) · árbol · café</p></div></div>'+
    '<div class="tip">Ojo: «casa» tiene acento prosódico en <b>ca</b>, pero <b>no lleva tilde</b>. Todas las palabras tienen acento al hablar; solo algunas llevan tilde al escribir.</div>'+
    '<div class="card"><h2>🥁 La sílaba tónica</h2><p>La <b>sílaba tónica</b> es la que se pronuncia con más fuerza. Las demás se llaman <b>átonas</b>. Elige una palabra y toca el botón para ver cómo «rebota» la sílaba tónica.</p>'+
    '<div class="row"><label for="demoSel" class="muted">Palabra:</label><select id="demoSel">'+demo.map(function(w,i){return '<option value="'+i+'">'+esc(w.w)+'</option>';}).join('')+'</select><button type="button" class="btn sm" id="demoBtn">▶ ¡Pronúncialo!</button></div>'+
    '<div id="demoOut" style="margin-top:14px"></div></div>'+
    '<div class="card"><h2>🖼️ Ejemplos ilustrados</h2><p class="muted">La sílaba tónica está resaltada en rosa. Fíjate cuáles llevan tilde.</p><div class="grid">'+ex.map(function(w){return wordCard(w);}).join('')+'</div></div>'+
    '<div id="mp"></div>');
  function show(){
    var w=demo[+$('#demoSel',host).value];
    var o=$('#demoOut',host);
    o.innerHTML='<div class="bounce">'+sylsHTML(w.s,w.t)+'</div><p style="margin-top:10px">Sílaba tónica: <b class="tn">'+esc(w.s[w.t])+'</b> · Sílabas átonas: '+w.s.filter(function(_,i){return i!==w.t;}).map(esc).join(', ')+'.</p>';
    react('ic','jump','excite');
  }
  $('#demoBtn',host).onclick=show;$('#demoSel',host).onchange=show;show();
  miniPractice($('#mp',host),[qTonic],3);
};

/* ---------- 2. CLASIFICACIÓN ---------- */
VIEWS.clasificacion=function(host){
  var INFO={
    aguda:{t:'Agudas',d:'La sílaba tónica es la <b>última</b>.',h:'Cuenta desde el final: la tónica es la sílaba número 1.',ex:['café','canción','papel','ciudad','reloj','jamás']},
    grave:{t:'Graves o llanas',d:'La sílaba tónica es la <b>penúltima</b>.',h:'Cuenta desde el final: la tónica es la sílaba número 2. Es el tipo de palabra más común en español.',ex:['árbol','lápiz','mesa','cuaderno','joven','difícil']},
    esdrujula:{t:'Esdrújulas',d:'La sílaba tónica es la <b>antepenúltima</b>.',h:'Cuenta desde el final: la tónica es la sílaba número 3.',ex:['música','teléfono','pájaro','sábado','murciélago','matemáticas']},
    sobresdrujula:{t:'Sobresdrújulas',d:'La sílaba tónica va <b>antes de la antepenúltima</b>.',h:'Suelen ser verbos con dos pronombres pegados: cuenta + me + lo = cuéntamelo.',ex:['cuéntamelo','llévatelo','guárdamelo','préstamelo','cómpraselo']}
  };
  var cur='aguda',sel=WORDS[0],flt='todas';
  host.innerHTML=page('--c-clasif',
    head('Módulo 2','Clasificación de las palabras')+
    coach('Para clasificar una palabra, <b>cuenta las sílabas desde el final</b>. Dónde cae la fuerza de voz te dice si es aguda, grave, esdrújula o sobresdrújula.','think','curio','cc')+
    '<div class="tabs" role="tablist" id="ctabs">'+TYPES.map(function(t){return '<button type="button" role="tab" class="tab" data-t="'+t+'" aria-selected="'+(t===cur)+'">'+INFO[t].t+'</button>';}).join('')+'</div>'+
    '<div class="card" id="cbody"></div>'+
    '<div class="card"><h2>🔎 Explorador de palabras</h2><p class="muted">Elige un tipo y toca una palabra para ver sus sílabas y por qué se clasifica así.</p><div class="tabs" id="ftabs" style="margin-bottom:10px"></div><div class="chips" id="wlist"></div><div id="wdet" style="margin-top:14px"></div></div>'+
    '<div id="mp"></div>');
  function body(){
    var I=INFO[cur];
    $('#cbody',host).innerHTML='<h2>'+I.t+'</h2><p>'+I.d+'</p><p class="tip">'+I.h+'</p><div class="grid" style="margin-top:12px">'+byW(I.ex).map(function(w){return wordCard(w);}).join('')+'</div>';
    $$('#ctabs .tab',host).forEach(function(b){b.setAttribute('aria-selected',String(b.getAttribute('data-t')===cur));});
  }
  function explorer(){
    var fl=['todas'].concat(TYPES);
    $('#ftabs',host).innerHTML=fl.map(function(t){return '<button type="button" class="tab" data-f="'+t+'" aria-selected="'+(t===flt)+'">'+(t==='todas'?'Todas':INFO[t].t)+'</button>';}).join('');
    var list=WORDS.filter(function(w){return flt==='todas'||w.type===flt;});
    $('#wlist',host).innerHTML=list.map(function(w){return '<button type="button" class="wchip" data-w="'+esc(w.w)+'" aria-pressed="'+(w.w===sel.w)+'">'+esc(w.w)+'</button>';}).join('');
    var w=sel;
    $('#wdet',host).innerHTML='<div class="wcard">'+(EMO[w.w]?'<span class="em">'+EMO[w.w]+'</span>':'')+sylsHTML(w.s,w.t)+posLabels(w.s.length,w.t)+'<div>'+why(w)+'</div></div>';
  }
  host.onclick=function(e){
    var t=e.target.closest('[data-t],[data-f],[data-w]');if(!t)return;
    if(t.hasAttribute('data-t')){cur=t.getAttribute('data-t');body();react('cc','stand','joy','¡Eso es! Las '+INFO[cur].t.toLowerCase()+' se reconocen contando desde el final.');}
    else if(t.hasAttribute('data-f')){flt=t.getAttribute('data-f');if(flt!=='todas'&&sel.type!==flt)sel=WORDS.filter(function(w){return w.type===flt;})[0];explorer();}
    else{sel=WORDS.filter(function(w){return w.w===t.getAttribute('data-w');})[0];explorer();react('cc','stand','curio');}
  };
  body();explorer();
  miniPractice($('#mp',host),[qClasif],4);
};

/* ---------- 3. REGLAS ---------- */
VIEWS.reglas=function(host){
  var R=[
    {t:'Agudas',c:'--c-reglas',r:'Llevan tilde si terminan en <b>n, s o vocal</b>.',si:['café','canción','jamás','sofá'],no:['papel','ciudad','reloj','amor']},
    {t:'Graves o llanas',c:'--c-clasif',r:'Llevan tilde si <b>NO</b> terminan en n, s ni vocal.',si:['árbol','lápiz','fácil','azúcar'],no:['mesa','joven','lunes','camino']},
    {t:'Esdrújulas',c:'--c-dipt',r:'<b>Siempre</b> llevan tilde.',si:['música','teléfono','pájaro','sábado'],no:[]},
    {t:'Sobresdrújulas',c:'--c-diac',r:'<b>Siempre</b> llevan tilde.',si:['cuéntamelo','llévatelo','guárdamelo'],no:[]}
  ];
  host.innerHTML=page('--c-reglas',
    head('Módulo 3','Reglas de acentuación')+
    coach('Hay solo <b>dos pasos</b>: 1) busca la sílaba tónica y clasifica la palabra; 2) mira con qué letra termina. ¡Con eso sabes si lleva tilde!','think','curio','rc')+
    '<div class="grid">'+R.map(function(r){return '<div class="card" style="--mc:var('+r.c+')"><h2>'+r.t+'</h2><p>'+r.r+'</p><p class="muted" style="margin-bottom:4px">Con tilde:</p>'+chipsOf(r.si)+(r.no.length?'<p class="muted" style="margin:10px 0 4px">Sin tilde:</p>'+chipsOf(r.no):'')+'</div>';}).join('')+'</div>'+
    '<div class="card"><h2>Tabla resumen</h2><div class="scroll"><table class="tbl"><thead><tr><th>Tipo</th><th>Sílaba tónica</th><th>¿Cuándo lleva tilde?</th></tr></thead><tbody>'+
    '<tr><td>Aguda</td><td>Última</td><td>Si termina en n, s o vocal</td></tr><tr><td>Grave</td><td>Penúltima</td><td>Si no termina en n, s ni vocal</td></tr><tr><td>Esdrújula</td><td>Antepenúltima</td><td>Siempre</td></tr><tr><td>Sobresdrújula</td><td>Anterior a la antepenúltima</td><td>Siempre</td></tr></tbody></table></div></div>'+
    '<div class="card"><h2>🧪 Detector de tilde</h2><p>Elige el tipo de palabra y su última letra. Ñiki te dice si lleva tilde.</p><div class="row"><label for="dtT" class="muted">Tipo:</label><select id="dtT"><option value="aguda">Aguda</option><option value="grave">Grave o llana</option><option value="esdrujula">Esdrújula</option><option value="sobresdrujula">Sobresdrújula</option></select><label for="dtE" class="muted">Termina en:</label><select id="dtE"><option value="nsv">n, s o vocal</option><option value="otra">otra consonante</option></select></div><div id="dtOut" style="margin-top:12px"></div></div>'+
    '<div class="grid"><div class="tip">☝️ <b>Monosílabos</b> (una sola sílaba) como <i>fe, fui, dio, vio, pie, sol</i> no llevan tilde. Solo la llevan los de tilde diacrítica (módulo 5).</div><div class="tip">☝️ La <b>y</b> al final cuenta como consonante: <i>Uruguay</i> y <i>virrey</i> son agudas terminadas en consonante distinta de n o s, por eso no llevan tilde.</div></div>'+
    '<div id="mp"></div>');
  function det(){
    var t=$('#dtT',host).value,e=$('#dtE',host).value,yes,why2,ex;
    if(t==='aguda'){yes=e==='nsv';why2=yes?'Las agudas terminadas en n, s o vocal llevan tilde.':'Las agudas terminadas en otra consonante no llevan tilde.';ex=yes?'café, canción, jamás':'papel, ciudad, reloj';}
    else if(t==='grave'){yes=e==='otra';why2=yes?'Las graves que no terminan en n, s ni vocal llevan tilde.':'Las graves terminadas en n, s o vocal no llevan tilde.';ex=yes?'árbol, lápiz, fácil':'mesa, joven, lunes';}
    else{yes=true;why2='Las '+(t==='esdrujula'?'esdrújulas':'sobresdrújulas')+' siempre llevan tilde, sin importar con qué letra terminen.';ex=t==='esdrujula'?'música, teléfono, pájaro':'cuéntamelo, llévatelo';}
    $('#dtOut',host).innerHTML='<div class="fb '+(yes?'good':'bad')+'"><b>'+(yes?'✔ Sí lleva tilde.':'✘ No lleva tilde.')+'</b> '+why2+' Ejemplos: <i>'+ex+'</i>.</div>';
    react('rc',yes?'jump':'stand',yes?'excite':'curio');
  }
  $('#dtT',host).onchange=det;$('#dtE',host).onchange=det;det();
  miniPractice($('#mp',host),[qTilde,qTilde,qRule,qTilde],4);
};

/* ---------- 4. DIPTONGOS E HIATOS ---------- */
VIEWS.diptongos=function(host){
  var tab='dip',open={};
  host.innerHTML=page('--c-dipt',
    head('Módulo 4','Diptongos e hiatos')+
    coach('Cuando dos vocales van juntas, hay que decidir: ¿suenan en <b>una sílaba</b> (diptongo) o en <b>dos</b> (hiato)?','think','curio','dc')+
    '<div class="card"><h2>Vocales abiertas y cerradas</h2><div class="row"><span class="syl dp">a</span><span class="syl dp">e</span><span class="syl dp">o</span><span>abiertas (fuertes)</span></div><div class="row" style="margin-top:8px"><span class="syl">i</span><span class="syl">u</span><span>cerradas (débiles)</span></div></div>'+
    '<div class="grid"><div class="card"><h2>🤝 Diptongo</h2><p>Dos vocales juntas en <b>una sola sílaba</b>.</p><ul><li>abierta + cerrada: <b>ai</b>re, <b>cau</b>sa</li><li>cerrada + abierta: <b>cie</b>lo, a<b>gua</b></li><li>dos cerradas distintas: <b>ciu</b>dad, <b>cui</b>dado</li></ul></div>'+
    '<div class="card"><h2>✂️ Hiato</h2><p>Dos vocales juntas en <b>sílabas distintas</b>.</p><ul><li>dos abiertas: ca-er, po-e-ta</li><li>dos iguales: le-er</li><li>cerrada tónica + abierta (o al revés): rí-o, pa-ís</li></ul></div></div>'+
    '<div class="grid"><div class="tip"><b>¿Dónde va la tilde en un diptongo?</b> En la vocal abierta (cam<b>ió</b>n, murc<b>ié</b>lago). Si son dos cerradas, en la segunda (cuídate).</div><div class="tip"><b>En un hiato con cerrada tónica</b> la tilde se escribe siempre (día, país, río, baúl), aunque las reglas generales no la pidan.</div></div>'+
    '<div class="card"><h2>🎛️ Separa la palabra</h2><p class="muted">Toca una palabra para ver cómo se separa en sílabas.</p><div class="tabs" id="dtabs" style="margin-bottom:12px"></div><div class="grid" id="dgrid"></div></div>'+
    '<div id="mp"></div>');
  function hi(d){
    var s=d.s;
    return s.map(function(x,i){
      var p=strip(x.toLowerCase()),mark=false;
      if(d.k==='dip')mark=/[aeiou]{2}/.test(p.replace(/^qu|^gu(?=[ei])/,'x'));
      else mark=(i<s.length-1&&/[aeiouáéíóú]$/i.test(x)&&/^[aeiouáéíóú]/i.test(s[i+1]))||(i>0&&/[aeiouáéíóú]$/i.test(s[i-1])&&/^[aeiouáéíóú]/i.test(x));
      return (i?'<span class="sep">-</span>':'')+'<span class="syl'+(mark?' dp':'')+'">'+esc(x)+'</span>';
    }).join('');
  }
  function grid(){
    $('#dtabs',host).innerHTML=[['dip','Diptongos'],['hia','Hiatos']].map(function(t){return '<button type="button" class="tab" data-k="'+t[0]+'" aria-selected="'+(tab===t[0])+'">'+t[1]+'</button>';}).join('');
    $('#dgrid',host).innerHTML=DIP.filter(function(d){return d.k===tab;}).map(function(d){
      var o=open[d.w];
      return '<button type="button" class="flip" data-w="'+esc(d.w)+'" style="text-align:left"><span class="pair">'+esc(d.w)+'</span>'+(o?'<div class="syls" style="margin:8px 0">'+hi(d)+'</div><span class="muted" style="font-weight:700">'+esc(d.n)+'</span>':'<div class="muted" style="margin-top:6px">✂️ Toca para separar</div>')+'</button>';
    }).join('');
  }
  host.onclick=function(e){
    var k=e.target.closest('[data-k],[data-w]');if(!k)return;
    if(k.hasAttribute('data-k')){tab=k.getAttribute('data-k');grid();}
    else{var w=k.getAttribute('data-w');open[w]=!open[w];grid();react('dc','stand','curio');}
  };
  grid();
  miniPractice($('#mp',host),[qDip],5);
};

/* ---------- 5. TILDE DIACRÍTICA ---------- */

    '<div class="card"><h2>¿Qué es?</h2><p>La tilde diacrítica se usa en palabras de <b>una sola sílaba</b> para distinguir dos palabras iguales con <b>función distinta</b>. La palabra con tilde es la «fuerte» (pronombre, verbo, adverbio…) y la que no la lleva es la «débil» (artículo, posesivo, preposición…).</p></div>'+

    }).join('')+'</div>'+
    '<div class="tip">☝️ Según la RAE, los demostrativos <i>este, ese, aquel</i> y la palabra <i>solo</i> ya no llevan tilde, ni siquiera cuando podrían confundirse.</div>'+
    '<div id="mp"></div>');
  miniPractice($('#mp',host),[qDiac],5);

function poolBy(types,n,ok){
  var out=[];types.forEach(function(t){out=out.concat(pickN((ok?okWords():WORDS).filter(function(w){return w.type===t;}),n[types.indexOf(t)]));});
  return shuffle(out);
}

/* Ruleta de palabras */
function ruleta(host,back){
  var seg=['aguda','grave','esdrujula','sobresdrujula','aguda','grave','esdrujula','sobresdrujula'];
  var COL={aguda:'#e0453f',grave:'#2f80ed',esdrujula:'#1f8f48',sobresdrujula:'#b87800'};
  var R=8,rot=0,round=0,okc=0,pts=0,busy=false,cur=null,timer=null;
  onLeave(function(){clearTimeout(timer);});
  function intro(){
    host.innerHTML=page('--c-juegos',head('Módulo 7 · Juego','Ruleta de palabras')+
      '<div class="card"><h2>¿Cómo funciona?</h2><p>Gira la ruleta. Cuando se detenga, te dirá un tipo de palabra: <b>aguda, grave, esdrújula o sobresdrújula</b>. Elige entre cuatro palabras la que sea de ese tipo.</p><p class="tip">Son 8 giros. Cada acierto suma 10 puntos.</p></div>'+
      coach('¡Que gire la ruleta! Recuerda: cuenta las sílabas desde el final.','jump','excite','qc')+
      '<div class="row"><button type="button" class="btn" id="go">▶ ¡Empezar!</button><button type="button" class="btn ghost" id="bk">← Volver</button></div>');
    $('#go',host).onclick=function(){round=0;okc=0;pts=0;frame();};$('#bk',host).onclick=back;
  }
  function frame(){
    var grad='conic-gradient('+seg.map(function(t,i){return COL[t]+' '+(i*45)+'deg '+((i+1)*45)+'deg';}).join(',')+')';
    var labels=seg.map(function(t,i){return '<div class="lb" style="transform:rotate('+(i*45+22.5)+'deg)"><span>'+TNAME[t].replace('Grave o llana','Grave')+'</span></div>';}).join('');
    host.innerHTML=page('--c-juegos',head('Módulo 7 · Juego','Ruleta de palabras')+
      '<div class="qhead"><span id="rn">Giro '+(round+1)+' de '+R+'</span><span>⭐ '+pts+'</span></div><div class="bar"><i style="width:'+(round/R*100)+'%"></i></div>'+
      '<div class="wheelbox"><div class="ptr"></div><div class="wheel" id="wh" style="background:'+grad+';transform:rotate('+rot+'deg)">'+labels+'</div><div class="hub">🎡</div></div>'+
      '<div class="row" style="justify-content:center"><button type="button" class="btn" id="spin">🎯 ¡Girar!</button></div>'+
      coach('Toca <b>¡Girar!</b> y mira dónde cae la flecha.','stand','joy','qc')+'<div id="qa"></div>');
    $('#spin',host).onclick=spin;
  }
  function spin(){
    if(busy)return;busy=true;$('#spin',host).disabled=true;
    $('#qa',host).innerHTML='';
    react('qc','run','excite','¡Girando…!');
    rot+=1440+Math.floor(Math.random()*360);
    $('#wh',host).style.transform='rotate('+rot+'deg)';
    timer=setTimeout(land,4200);
  }
  function land(){
    var ang=(360-(rot%360))%360,idx=Math.floor(ang/45),t=seg[idx];
    var good=rnd(WORDS.filter(function(w){return w.type===t;}));
    var bad=pickN(WORDS.filter(function(w){return w.type!==t;}),3);
    var opts=shuffle([good].concat(bad));
    var q={cat:'clasif',prompt:'La ruleta cayó en <b style="color:'+COL[t]+'">'+TNAME[t]+'</b>. Elige la palabra que es <b>'+TLOW[t]+'</b>:',show:'',opts:opts.map(function(w){return w.w;}),ans:opts.indexOf(good),why:why(good)};
    react('qc','think','curio','¡Cayó en <b>'+TNAME[t]+'</b>! Piensa dónde cae la fuerza de voz.');
    var h=askQuestion($('#qa',host),q,function(ok){
      record('clasif',ok);if(ok){okc++;pts+=10;}
      react('qc',ok?'jump':'think',ok?'joy':'confusion',ok?'¡Muy bien! 🎉':'Casi. Revisa la explicación.');
      round++;
      var b=document.createElement('button');b.type='button';b.className='btn';b.style.marginTop='12px';
      b.textContent=round>=R?'Ver resultados 🏁':'Girar otra vez →';
      b.onclick=function(){busy=false;if(round>=R)end();else frame();};
      h.fb().appendChild(b);b.focus({preventScroll:true});
    });
  }
  function end(){
    S.played++;if(okc>(S.best.ruleta||0))S.best.ruleta=okc;
    var bonus=okc===R?20:0;gain(bonus);save();updateChips();checkBadges();
    if(okc>=6){sWin();confetti();}
    host.innerHTML=page('--c-juegos',head('Módulo 7 · Juego','Resultados de la ruleta')+
      '<div class="card" style="text-align:center"><div class="score-big">'+okc+' / '+R+'</div><p><b>'+Math.round(okc/R*100)+' % de aciertos</b> · +'+(pts+bonus)+' puntos'+(bonus?' (bonus perfecto)':'')+'</p><p>'+(okc>=6?'¡Excelente giro, campeón!':'Sigue practicando y la próxima será mejor.')+'</p></div>'+
      coach(okc>=6?'¡Lo hiciste genial!':'Repasa el módulo 2 y vuelve a girar.',okc>=6?'jump':'think',okc>=6?'laugh':'curio','qc')+
      '<div class="row"><button type="button" class="btn" id="ag">🔁 Jugar otra vez</button><button type="button" class="btn ghost" id="bk">← Volver</button></div>');
    $('#ag',host).onclick=function(){round=0;okc=0;pts=0;frame();};$('#bk',host).onclick=back;
  }
  intro();
}

    '<div class="stats"><div class="stat"><b>'+S.pts+'</b><span>puntos acumulados</span></div><div class="stat"><b>'+l.e+' '+l.n+'</b><span>nivel de aprendizaje</span></div><div class="stat"><b>'+acc+' %</b><span>aciertos ('+okT+' de '+all+')</span></div><div class="stat"><b>'+S.streakBest+'</b><span>mejor racha</span></div><div class="stat"><b>'+S.played+'</b><span>actividades completadas</span></div></div>'+
    '<div class="two"><div class="card"><h2>Nivel de aprendizaje</h2><div class="bar" role="img" aria-label="Avance de nivel: '+pct+' %"><i style="width:0" data-bw="'+pct+'%"></i></div><p class="muted" style="margin:8px 0 0">'+LV.map(function(v,i){return (i<=li?'<b>':'')+v.e+' '+v.n+' ('+v.p+')'+(i<=li?'</b>':'');}).join(' · ')+'</p></div>'+
    '<div class="card"><h2>Puntos de los últimos 7 días</h2>'+colsHTML(week())+'</div></div>'+
    '<div class="two"><div class="card"><h2>Estadísticas por tema</h2><div style="display:flex;flex-direction:column;gap:10px">'+cats+'</div></div>'+
    '<div class="card"><h2>Evolución en la evaluación</h2>'+(spark||'<div class="empty">Haz la evaluación al menos dos veces para ver tu evolución.</div>')+'</div></div>'+
    '<div class="card"><h2>🏅 Insignias ('+Object.keys(S.badges).length+' de '+BADGES.length+')</h2><div class="bds">'+bd+'</div></div>'+
    '<div class="card"><h2>Resultados de la evaluación</h2>'+hist+(S.exams.length?'<p style="margin-top:12px"><a class="btn sm" href="#certificado" style="--mc:var(--c-exam)">🎓 Ver certificado</a></p>':'')+'</div>'+
    '<div class="card"><h2>Reiniciar</h2><p class="muted">Borra tus puntos, insignias y resultados de este dispositivo.</p><div class="row"><button type="button" class="btn ghost sm" id="rs1">🗑️ Borrar mi progreso</button><span id="rs2" hidden><button type="button" class="btn sm" id="rsY" style="--mc:var(--bad)">Sí, borrar todo</button> <button type="button" class="btn ghost sm" id="rsN">Cancelar</button></span></div></div>');
  $('#rs1',host).onclick=function(){this.hidden=true;$('#rs2',host).hidden=false;};
  $('#rsN',host).onclick=function(){$('#rs1',host).hidden=false;$('#rs2',host).hidden=true;};
  $('#rsY',host).onclick=function(){S=defState();streak=0;save();updateChips();toast('Progreso reiniciado');VIEWS.progreso(host);};
  animateIn(host);
};

/* ============ NAVEGACIÓN ============ */
function buildNav(){
  var G={inicio:'',intro:'Aprende',ejercicios:'Practica',progreso:'Mi avance'};
  $('#nav').innerHTML=MODS.map(function(m){
    return (G[m.id]?'<div class="grp">'+G[m.id]+'</div>':'')+'<a href="#'+m.id+'" data-id="'+m.id+'" style="--mc:var('+m.c+')"><span class="ni" aria-hidden="true">'+m.e+'</span><span>'+m.t+'</span><span class="nk" aria-hidden="true"></span></a>';}).join('')+
    '<div class="guide">'+nikiEl('stand','joy','sm')+'<span>¡Aprender jugando es una aventura! — <b>Ñiki</b></span></div>';
  var T=[['inicio','🏠','Inicio'],['intro','📖','Aprender'],['ejercicios','📝','Practicar'],['juegos','🎮','Juegos']];
  $('#tabbar').innerHTML=T.map(function(t){return '<a href="#'+t[0]+'" data-id="'+t[0]+'"><span class="ti" aria-hidden="true">'+t[1]+'</span><span>'+t[2]+'</span></a>';}).join('')+
    '<button type="button" id="moreBtn" aria-expanded="false" aria-controls="nav"><span class="ti" aria-hidden="true">☰</span><span>Más</span></button>';
}
function route(){
  cleanups.forEach(function(f){try{f();}catch(e){}});cleanups=[];
  var main=$('#main');main.onclick=null;
  var id=(location.hash||'').replace('#','')||'inicio';
  if(!VIEWS[id])id=(id==='certificado')?'certificado':'inicio';
  $$('#nav a,#tabbar a').forEach(function(a){if(a.getAttribute('data-id')===id)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  var mb=$('#moreBtn');if(mb){var inTab=['inicio','intro','ejercicios','juegos'].indexOf(id)>-1;mb.setAttribute('aria-current',inTab?'false':'page');if(inTab)mb.removeAttribute('aria-current');}
  $$('#nav a').forEach(function(a){var k=a.getAttribute('data-id'),nk=a.querySelector('.nk');if(nk)nk.textContent=S.visited[k]?'✔':'';});
  main.innerHTML='';
  VIEWS[id](main);
  if(['intro','clasificacion','reglas','diptongos','diacritica'].indexOf(id)>-1&&!S.visited[id]){S.visited[id]=1;save();checkBadges();}
  closeMenu();
  window.scrollTo(0,0);
  try{main.focus({preventScroll:true});}catch(e){}
}
function setMenu(o){
  $('#nav').classList.toggle('open',o);
  var b=$('#menuBtn'),m=$('#moreBtn');
  b.setAttribute('aria-expanded',String(o));b.textContent=o?'✕':'☰';
  if(m)m.setAttribute('aria-expanded',String(o));
}
function closeMenu(){setMenu(false);}
$('#menuBtn').addEventListener('click',function(){setMenu(!$('#nav').classList.contains('open'));});
document.addEventListener('click',function(e){var m=e.target.closest('#moreBtn');if(m)setMenu(!$('#nav').classList.contains('open'));});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeMenu();});
window.addEventListener('hashchange',route);
function curId(){return (location.hash||'').replace('#','')||'inicio';}
document.addEventListener('click',function(e){var a=e.target.closest('#nav a,#tabbar a');if(a&&a.getAttribute('href')==='#'+curId()){e.preventDefault();route();}});
document.addEventListener('click',function(e){var a=e.target.closest('main a[href^="#"]');if(a&&a.getAttribute('href')==='#'+curId()){e.preventDefault();route();}});
/* tema claro / oscuro */
function applyTheme(t){
  if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme');
}
$('#themeBtn').addEventListener('click',function(){
  var cur=document.documentElement.getAttribute('data-theme')||((window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');
  var nx=cur==='dark'?'light':'dark';applyTheme(nx);try{localStorage.setItem('acentua-theme',nx);}catch(e){}
});
$('#brandImg').src=NIKI.f.joy;
buildNav();updateChips();route();
</script>
